# Nginx configuration for Maximo MCP Server
# Save this file to /etc/nginx/sites-available/mxm-mcp-server on your Ubuntu host
# Then enable it with: ln -s /etc/nginx/sites-available/mxm-mcp-server /etc/nginx/sites-enabled/

# Rate limiting: limit request frequency (10 requests per second per IP)
# 10MB zone can store about 160,000 IP addresses in state
limit_req_zone $binary_remote_addr zone=mcp_limit_zone:10m rate=10r/s;

# Connection limiting: limit concurrent connections from a single IP
limit_conn_zone $binary_remote_addr zone=mcp_conn_zone:10m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp-server1.biendongpoc.vn;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp-server1.biendongpoc.vn;

    # SSL Certificates (BiendongPOC certificate)
    ssl_certificate /etc/nginx/ssl/certificate-2025.pem;
    ssl_certificate_key /etc/nginx/ssl/privatekey-2025.pem;

    # Optional: Include CA Chain if available
    ssl_trusted_certificate /etc/nginx/ssl/ca-certificate-2025.pem;

    # Modern SSL Protocols and Security Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Session configuration
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;

    # CORS headers for OAuth / DCR endpoints are set per-location below.


    access_log /var/log/nginx/mxm-mcp-server.access.log;
    error_log /var/log/nginx/mxm-mcp-server.error.log warn;

    # Health check endpoint (bypass auth at proxy level if desired, or let app handle it)
    location /health {
        proxy_pass http://127.0.0.1:3030/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth metadata discovery endpoints — must be CORS-accessible from MCP client origins
    location ~ ^/(register|token|\.well-known/) {
        # The Express app also sets Access-Control-Allow-Origin/-Headers on these
        # routes. Without hiding the upstream copies, nginx's add_header below
        # would be appended alongside them, producing duplicate CORS header
        # values — which browsers treat as invalid and block the response.
        # Nginx is the single source of truth for these headers.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;

        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*"              always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age       86400            always;
            add_header Content-Length               0;
            return 204;
        }

        # CORS headers (required for browser-based MCP clients like claude.ai)
        add_header Access-Control-Allow-Origin  "*"                       always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        # Security headers — must be re-declared here because nginx does NOT inherit
        # add_header directives from the parent server block when a location block
        # defines its own add_header directives.
        add_header X-Content-Type-Options "nosniff"              always;
        add_header X-XSS-Protection       "1; mode=block"        always;
        add_header Referrer-Policy        "no-referrer-when-downgrade" always;
        # Note: X-Frame-Options and CSP are intentionally omitted for OAuth endpoints
        # because they need to be embeddable/accessible cross-origin by MCP clients.

        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }


    # Secure MCP Endpoint Proxy
    location / {
        # Rate limiting: Allow burst of 20 requests with no artificial delay
        limit_req zone=mcp_limit_zone burst=20 nodelay;

        # Connection limiting: Allow max 5 concurrent connections per IP
        limit_conn mcp_conn_zone 5;

        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;

        # WebSocket and connection-upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard headers to forward real IP information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security tuning for Streamable HTTP / SSE:
        # We disable proxy buffering and proxy cache. This prevents Nginx from holding onto 
        # chunked/streaming data, allowing immediate and smooth end-to-end communication.
        proxy_buffering off;
        proxy_cache off;
        
        # Increase timeouts for long-running agent tool invocations
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # Handle large payloads if querying big work order datasets
        client_max_body_size 20M;
    }
}
